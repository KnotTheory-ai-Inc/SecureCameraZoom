[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securecamerazoom"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pycryptodome"]

[tool.setuptools.packages.find]
where = ["src/python"]
namespaces = true

[tool.setuptools]
py-modules = ["stencil_lib"]
package-dir = {"" = "src/python"}
